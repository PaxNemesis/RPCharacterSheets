<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPCharacterSheets</title>
    <!--
      Applies the saved theme and text size before the first paint, so the page doesn't flash. Keep the
      storage key and values in step with useDisplaySettings (src/components/RootLayout/components/SettingsMenu).
    -->
    <script>
      (function () {
        var settings = {};
        try {
          settings = JSON.parse(localStorage.getItem('rpcs-display-settings')) || {};
        } catch (error) {}
        var dark =
          settings.theme === 'dark' ||
          (settings.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.dataset.theme = dark ? 'dark' : 'light';
        if ([0.85, 1, 1.15, 1.3].indexOf(settings.scale) !== -1)
          root.style.setProperty('--ui-scale', String(settings.scale));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
